.page {
  display: grid;
  place-items: center;
  min-height: 100dvh;
  padding: 20px;
}

.settings-button {
  position: fixed;
  right: 12px;
  bottom: 12px;
  border: 0;
  background: none;
  color: var(--muted);
  font-size: 1.5rem;
  opacity: 0.3;
  cursor: pointer;
}

.settings-button:hover,

  opacity: 1;
}

  border: 1px solid var(--muted);
  border-radius: 8px;
  background: var(--bg);
  color: var(--fg);

  fieldset {
    margin: 0 0 1rem;
  }

  label {
    display: block;
    margin: 0.25rem 0;
  }

  .field {
    margin-bottom: 1rem;
  }
}

.test-banner {
  position: fixed;
  inset: 0 0 auto;
  padding: 0.4rem 1rem;
  background: var(--warning);
  color: #fff;
  font-weight: bold;
  text-align: center;

  &[hidden] {
    display: none;
  }
}

    <style>
.clock {
  width: 100%;

  .spoken {
    display: flex;
    gap: 0.4em;
    font-size: 10vw;
    line-height: 1.1;
  }

  /* Fixed width so the phrase doesn't shift when + changes to − */
  .spoken-sign {
    flex: none;
    width: 0.6em;
    text-align: center;
  }

  /* Equal-width digits, so a changing number doesn't move the text after it */
  .spoken-phrase {
    font-variant-numeric: tabular-nums;
  }

  /*
   * In the countdown the seconds change every second, and 9 → 10 changes the
   * number of digits. Give the number a two-digit slot so the words after it
   * stay put.
   */
  &[data-countdown] .num:first-of-type {
    display: inline-block;
    min-width: 2ch;
    text-align: right;
  }

  /*
   * A thin line runs the full width; a much taller block sits centred on it
   * and grows across as the minute passes.
   */
  .bar {
    --progress: 0;
    --block-height: max(24px, 8vw);
    --line-height: max(4px, 1vw);
    position: relative;
    height: var(--block-height);
    margin: 1vw 0;
  }

  .bar::before {
    content: "";
    position: absolute;
    inset-inline: 0;
    top: 50%;
    height: var(--line-height);
    transform: translateY(-50%);
    background: var(--track);
  }

  .bar-fill {
    position: relative;
    height: 100%;
    background: var(--bar);
    transform: scaleX(var(--progress));
    transform-origin: left;
  }

  .digital {
    text-align: center;
    font-family: var(--font-mono);
    font-size: 7vw;
  }

  &[data-warning] .bar-fill {
    background: var(--warning);
  }
}

 * @param {Date} date
 * @returns {TimeParts}
 */

  return {
    hours: date.getHours(),
    minutes: date.getMinutes(),
    seconds: date.getSeconds(),
  };
}

return { timePartsFromDate };
})();

 * Returns data only. Each language in js/i18n turns that data into words,
 * so grammar and word order stay out of this file.

 * Rounding:
 *   "broadcast" - after 30 seconds, look ahead to the next minute and mark it
 *                 with a minus sign ("coming up to"). Before, mark it plus
 *                 ("just gone"). This is how most broadcasters speak.
 *   "classic"   - always the current minute, no sign. (The original Delphi
 *                 clock's standard mode.)

/**
 * @typedef {"broadcast" | "classic"} Rounding
 *
 * @typedef {{ kind: "countdown", seconds: number, hour: number }
 *   | { kind: "oclock", sign: Sign, hour: number }
 *   | { kind: "half", sign: Sign, hour: number }

 *   | { kind: "minutes", sign: Sign, hour: number, count: number, direction: Direction }
 * } SpokenTime
 *
 * @typedef {"+" | "−" | ""} Sign   (the minus is U+2212, not a hyphen)
 * @typedef {"past" | "to"} Direction
 */

/** 0, 13 and 24 all map into 1..12. */
const to12 = (hour) => ((hour + 11) % 12) + 1;

/**
 * @param {import("./timeParts.js").TimeParts} parts
 * @param {{ rounding?: Rounding }} [options]
 * @returns {SpokenTime}
 */

  // The last minute of the hour is a countdown, never a rounded time.
  if (minutes === 59) {
    return { kind: "countdown", seconds: 60 - seconds, hour: to12(hours + 1) };
  }

  const roundedUp = rounding === "broadcast" && seconds > 30;
  const m = minutes + (roundedUp ? 1 : 0); // always 0..59 here
  const past = m <= 30;
  const distance = past ? m : 60 - m;
  const hour = to12(past ? hours : hours + 1);
  const sign = rounding === "classic" ? "" : roundedUp ? "−" : "+";
  const direction = past ? "past" : "to";

  if (m === 0) return { kind: "oclock", sign, hour };
  if (m === 30) return { kind: "half", sign, hour };
  if (distance === 15) return { kind: "quarter", sign, hour, direction };
  return { kind: "minutes", sign, hour, count: distance, direction };
